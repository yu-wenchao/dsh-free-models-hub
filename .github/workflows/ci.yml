name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit tests (plugin core)
        run: npm test

      - name: Build artifacts are in sync with src/
        run: npm run verify

      - name: Package manifest sanity
        run: |
          node -e "
            const pkg = require('./package.json');
            if (!pkg.dsh || !pkg.dsh.bundle || !pkg.dsh.bundle.patch) throw new Error('missing dsh.bundle.patch (plugin would install but never activate)');
            if (!pkg.dsh || !pkg.dsh.client || pkg.dsh.client.platform !== 'web') throw new Error('missing dsh.client web platform');
            if (!pkg.exports || !pkg.exports['./client']) throw new Error('missing ./client export');
            console.log('manifest OK', pkg.name, pkg.version);
          "

  install-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pack the distributable tarball
        run: npm pack

      - name: Install it like a user would (offline, zero deps)
        run: |
          mkdir -p /tmp/install-test && cd /tmp/install-test
          npm init -y
          npm i "$GITHUB_WORKSPACE"/dsh-free-models-hub-*.tgz --ignore-scripts --no-audit --no-fund

      - name: Installer activation contract (11 checks)
        run: node scripts/installer-contract.cjs /tmp/install-test/node_modules/dsh-free-models-hub
